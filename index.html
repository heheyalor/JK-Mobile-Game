            // Bald head, strong dark eyebrows, rectangular dark-frame glasses, black collar jacket
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(-r, -r, r * 2, r * 2);

            // Black jacket shoulders
            ctx.fillStyle = '#111827';
            ctx.beginPath();
            ctx.ellipse(0, r * 0.85, r * 0.85, r * 0.45, 0, 0, Math.PI * 2);
            ctx.fill();

            // Head / skin tone
            const skinGrad = ctx.createRadialGradient(-r * 0.15, -r * 0.25, r * 0.1, 0, 0, r * 0.85);
            skinGrad.addColorStop(0, '#f3c6a5');
            skinGrad.addColorStop(1, '#d99b72');
            ctx.fillStyle = skinGrad;
            ctx.beginPath();
            ctx.ellipse(0, r * 0.04, r * 0.72, r * 0.82, 0, 0, Math.PI * 2);
            ctx.fill();

            // Forehead shine
            ctx.fillStyle = 'rgba(255,255,255,0.22)';
            ctx.beginPath();
            ctx.ellipse(-r * 0.18, -r * 0.45, r * 0.25, r * 0.12, -0.2, 0, Math.PI * 2);
            ctx.fill();

            // Thick dark eyebrows
            ctx.strokeStyle = '#1f2937';
            ctx.lineWidth = Math.max(3, r * 0.11);
            ctx.lineCap = 'round';
            // Left brow
            ctx.beginPath();
            ctx.moveTo(-r * 0.46, -r * 0.18);
            ctx.quadraticCurveTo(-r * 0.26, -r * 0.28, -r * 0.1, -r * 0.17);
            ctx.stroke();
            // Right brow
            ctx.beginPath();
            ctx.moveTo(r * 0.1, -r * 0.17);
            ctx.quadraticCurveTo(r * 0.26, -r * 0.28, r * 0.46, -r * 0.18);
            ctx.stroke();

            // Eyes
            ctx.fillStyle = '#111827';
            const eyeY = -r * 0.02;
            ctx.beginPath();
            ctx.arc(-r * 0.27, eyeY, r * 0.085, 0, Math.PI * 2);
            ctx.arc(r * 0.27, eyeY, r * 0.085, 0, Math.PI * 2);
            ctx.fill();

            // Eye catchlights
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-r * 0.29, eyeY - r * 0.025, r * 0.028, 0, Math.PI * 2);
            ctx.arc(r * 0.25, eyeY - r * 0.025, r * 0.028, 0, Math.PI * 2);
            ctx.fill();

            // Rectangular Wireframe Glasses
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = Math.max(2, r * 0.065);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
            // Left lens
            ctx.beginPath();
            ctx.roundRect(-r * 0.54, -r * 0.14, r * 0.46, r * 0.26, r * 0.05);
            ctx.fill();
            ctx.stroke();
            // Right lens
            ctx.beginPath();
            ctx.roundRect(r * 0.08, -r * 0.14, r * 0.46, r * 0.26, r * 0.05);
            ctx.fill();
            ctx.stroke();
            // Bridge
            ctx.beginPath();
            ctx.moveTo(-r * 0.08, -r * 0.06);
            ctx.lineTo(r * 0.08, -r * 0.06);
            ctx.stroke();

            // Nose
            ctx.strokeStyle = '#b4754e';
            ctx.lineWidth = Math.max(2, r * 0.05);
            ctx.beginPath();
            ctx.arc(0, r * 0.18, r * 0.09, 0.2, Math.PI - 0.2);
            ctx.stroke();

            // Mouth
            ctx.strokeStyle = '#8c4f32';
            ctx.lineWidth = Math.max(2, r * 0.06);
            ctx.beginPath();
            if (expression === 'happy') {
                ctx.arc(0, r * 0.36, r * 0.16, 0.15, Math.PI - 0.15);
            } else {
                ctx.moveTo(-r * 0.16, r * 0.42);
                ctx.quadraticCurveTo(0, r * 0.40, r * 0.16, r * 0.42);
            }
            ctx.stroke();
        }

        // Subtle inner border ring
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, r - 1, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
    }

    // =========================================================================
    // 2. SYNTHESIZED WEB AUDIO SOUND ENGINE (Zero External Audio Files)
    // =========================================================================
    class SoundFX {
        constructor() {
            this.ctx = null;
            this.enabled = true;
        }

        init() {
            if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) this.ctx = new AudioCtx();
            }
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        }

        beep(freq = 440, duration = 0.1, type = 'sine', slideFreq = null, gainVal = 0.12) {
            if (!this.enabled) return;
            try {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);
                if (slideFreq) {
                    osc.frequency.exponentialRampToValueAtTime(slideFreq, now + duration);
                }
                gain.gain.setValueAtTime(gainVal, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + duration);
            } catch (e) {
                // Ignore audio context locks
            }
        }

        jump() {
            this.beep(280, 0.13, 'triangle', 560, 0.14);
        }

        collect(combo = 1) {
            const base = 520 + Math.min(combo * 55, 600);
            this.beep(base, 0.09, 'sine', base * 1.35, 0.15);
        }

        hit() {
            this.beep(160, 0.25, 'sawtooth', 55, 0.2);
        }
    }

    function startGame(mode) {

    function spawnParticles(x, y, color, count = 12) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 50 + Math.random() * 170;
            state.particles.push({
                x,
                y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                r: 3 + Math.random() * 4,
                color,
                alpha: 1,
                life: 0.45 + Math.random() * 0.3
            });
        }
    }

    function addFloatingText(x, y, text, color = '#fbbf24') {
        state.floatingTexts.push({
            x,
            y,
            text,
            color,
            alpha: 1,
            vy: -55
        });
    }

    // =========================================================================
    // 5. UPDATE LOOP (FLAPPY SKY HOPPER & SNACK CATCHER)
    // =========================================================================
    function updateGame(dt) {
        state.elapsed += dt;
        const p = state.player;
        if (p.happyTimer > 0) p.happyTimer -= dt;
        if (p.invulnTimer > 0) p.invulnTimer -= dt;

        // Move clouds
        for (const c of state.clouds) {
            c.x -= c.speed * dt;
            if (c.x < -80) c.x = W + 80;
        }

        // Scroll background skyline
        const bgSpeed = state.mode === 'flappy' ? 45 : 15;
        for (const b of state.bgBuildings) {
            b.x -= bgSpeed * dt;
            if (b.x + b.w < 0) {
                b.x = W + Math.random() * 40;
                b.h = 110 + Math.random() * 180;
            }
        }

        if (state.mode === 'flappy') {
            updateFlappy(dt);
        } else {
            updateCatcher(dt);
        }

        // Update particles
        for (let i = state.particles.length - 1; i >= 0; i--) {
            const pt = state.particles[i];
            pt.x += pt.vx * dt;
            pt.y += pt.vy * dt;
            pt.vy += 240 * dt;
            pt.life -= dt;
            pt.alpha = Math.max(0, pt.life * 2);
            if (pt.life <= 0) state.particles.splice(i, 1);
        }

        // Update floating score texts
        for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
            const ft = state.floatingTexts[i];
            ft.y += ft.vy * dt;
            ft.alpha -= dt * 1.4;
            if (ft.alpha <= 0) state.floatingTexts.splice(i, 1);
        }
    }

    function updateFlappy(dt) {
        const p = state.player;
        const gravity = 860;
        p.vy += gravity * dt;
        p.y += p.vy * dt;
        p.tilt = Math.max(-0.45, Math.min(0.65, p.vy / 480));

        // Floor or ceiling collision
        if (p.y + p.r > H - 24 || p.y - p.r < 0) {
            spawnParticles(p.x, p.y, '#f43f5e', 20);
            triggerGameOver();
            return;
        }

        // Spawn skyscraper pipes + collectible snacks
        state.spawnTimer -= dt;
        const speed = Math.min(260, 165 + state.score * 0.45);
        if (state.spawnTimer <= 0) {
            state.spawnTimer = Math.max(1.25, 1.95 - state.score * 0.004);
            const gap = Math.max(138, 175 - state.score * 0.12);
            const minTop = 70;
            const maxTop = H - gap - 110;
            const topH = minTop + Math.random() * Math.max(40, maxTop - minTop);

            state.obstacles.push({
                x: W + 30,
                w: 58,
                topH,
                bottomY: topH + gap,
                passed: false
            });

            // Spawn a yummy treat inside the gap or after it
            const treat = GOOD_TREATS[Math.floor(Math.random() * GOOD_TREATS.length)];
            state.items.push({
                x: W + 59,
                y: topH + gap / 2,
                r: 20,
                ...treat,
                isHazard: false
            });
        }

        // Update obstacles
        for (let i = state.obstacles.length - 1; i >= 0; i--) {
            const ob = state.obstacles[i];
            ob.x -= speed * dt;

            // Score when passing obstacle
            if (!ob.passed && ob.x + ob.w < p.x) {
                ob.passed = true;
                state.score += 5;
                updateHUD();
            }

            // Circle-rectangle collision check
            const hitX = p.x + p.r * 0.8 > ob.x && p.x - p.r * 0.8 < ob.x + ob.w;
            const hitY = p.y - p.r * 0.8 < ob.topH || p.y + p.r * 0.8 > ob.bottomY;
            if (hitX && hitY) {
                spawnParticles(p.x, p.y, '#f43f5e', 22);
                triggerGameOver();
                return;
            }

            if (ob.x + ob.w < -40) {
                state.obstacles.splice(i, 1);
            }
        }

        // Update treats
        for (let i = state.items.length - 1; i >= 0; i--) {
            const it = state.items[i];
            it.x -= speed * dt;

            const dx = p.x - it.x;
            const dy = p.y - it.y;
            if (Math.hypot(dx, dy) < p.r + it.r) {
                state.combo++;
                const mult = Math.min(5, Math.floor(state.combo / 2) + 1);
                const gained = it.pts * mult;
                state.score += gained;
                p.happyTimer = 0.45;
                sfx.collect(state.combo);
                spawnParticles(it.x, it.y, it.color, 14);
                addFloatingText(it.x, it.y - 10, `+${gained}`, it.color);
                updateHUD();
                state.items.splice(i, 1);
                continue;
            }

            if (it.x < -40) state.items.splice(i, 1);
        }
    }

    function updateCatcher(dt) {
        const p = state.player;
        p.y = H - 85;
        // Smoothly glide toward targetX
        const diff = p.targetX - p.x;
        p.x += diff * Math.min(1, dt * 16);
        p.x = Math.max(p.r + 8, Math.min(W - p.r - 8, p.x));
        p.tilt = Math.max(-0.35, Math.min(0.35, diff * 0.004));

        // Spawn falling items
        state.itemTimer -= dt;
        if (state.itemTimer <= 0) {
            const difficulty = Math.min(1, state.elapsed / 75);
            state.itemTimer = Math.max(0.28, 0.68 - difficulty * 0.34);

            const isHazard = Math.random() < (0.24 + difficulty * 0.16);
            const margin = 34;
            const x = margin + Math.random() * (W - margin * 2);
            const fallSpeed = 165 + Math.random() * 110 + difficulty * 130;

            if (isHazard) {
                const haz = BAD_HAZARDS[Math.floor(Math.random() * BAD_HAZARDS.length)];
                state.items.push({
                    x,
                    y: -30,
                    vy: fallSpeed,
                    r: 22,
                    emoji: haz.emoji,
                    color: '#f43f5e',
                    isHazard: true,
                    rot: 0,
                    vRot: (Math.random() - 0.5) * 4
                });
            } else {
                const treat = GOOD_TREATS[Math.floor(Math.random() * GOOD_TREATS.length)];
                state.items.push({
                    x,
                    y: -30,
                    vy: fallSpeed,
                    r: 22,
                    ...treat,
                    isHazard: false,
                    rot: 0,
                    vRot: (Math.random() - 0.5) * 3
                });
            }
        }

        // Update falling items
        for (let i = state.items.length - 1; i >= 0; i--) {
            const it = state.items[i];
            it.y += it.vy * dt;
            it.rot += (it.vRot || 0) * dt;

            const dx = p.x - it.x;
            const dy = p.y - it.y;
            if (Math.hypot(dx, dy) < p.r + it.r - 4) {
                if (it.isHazard) {
                    if (p.invulnTimer <= 0) {
                        state.lives--;
                        state.combo = 0;
                        p.invulnTimer = 1.0;
                        sfx.hit();
                        spawnParticles(it.x, it.y, '#f43f5e', 20);
                        addFloatingText(p.x, p.y - 30, 'OUCH! -1 ❤️', '#f43f5e');
                        updateHUD();
                        if (state.lives <= 0) {
                            triggerGameOver();
                            return;
                        }
                    }
                } else {
                    state.combo++;
                    const mult = Math.min(5, Math.floor(state.combo / 2) + 1);
                    const gained = it.pts * mult;
                    state.score += gained;
                    p.happyTimer = 0.4;
                    sfx.collect(state.combo);
                    spawnParticles(it.x, it.y, it.color, 14);
                    addFloatingText(it.x, it.y - 12, `+${gained}`, it.color);
                    updateHUD();
                }
                state.items.splice(i, 1);
                continue;
            }

            // Missed item hits bottom
            if (it.y - it.r > H) {
                if (!it.isHazard) {
                    state.combo = 0;
                    updateHUD();
                }
                state.items.splice(i, 1);
            }
        }
    }

    // =========================================================================
    // 6. RENDERING PIPELINE
    // =========================================================================
    function renderGame() {
        ctx.clearRect(0, 0, W, H);

        // Dusk Urban Sky Gradient (inspired by the outdoor city photo)
        const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
        skyGrad.addColorStop(0, '#0f172a');
        skyGrad.addColorStop(0.55, '#1e293b');
        skyGrad.addColorStop(1, '#334155');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, W, H);

        // Soft clouds
        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        for (const c of state.clouds) {
            ctx.beginPath();
            ctx.arc(c.x, c.y, 24 * c.scale, 0, Math.PI * 2);
            ctx.arc(c.x + 18 * c.scale, c.y - 6 * c.scale, 18 * c.scale, 0, Math.PI * 2);
            ctx.arc(c.x - 18 * c.scale, c.y + 4 * c.scale, 16 * c.scale, 0, Math.PI * 2);
            ctx.fill();
        }

        // City Skyline Silhouette
        for (const b of state.bgBuildings) {
            const by = H - 24 - b.h;
            ctx.fillStyle = b.color;
            ctx.fillRect(b.x, by, b.w, b.h);

            // Illuminated building windows
            ctx.fillStyle = 'rgba(251, 191, 36, 0.22)';
            const cols = 2;
            const rows = b.windows;
            const ww = 8;
            const wh = 12;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    ctx.fillRect(b.x + 12 + c * 20, by + 16 + r * 26, ww, wh);
                }
            }
        }

        // Ground strip
        ctx.fillStyle = '#090d16';
        ctx.fillRect(0, H - 24, W, 24);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, H - 24);
        ctx.lineTo(W, H - 24);
        ctx.stroke();

        // Draw Obstacles (Flappy Mode)
        for (const ob of state.obstacles) {
            const pipeGrad = ctx.createLinearGradient(ob.x, 0, ob.x + ob.w, 0);
            pipeGrad.addColorStop(0, '#0284c7');
            pipeGrad.addColorStop(0.5, '#38bdf8');
            pipeGrad.addColorStop(1, '#0369a1');
            ctx.fillStyle = pipeGrad;

            // Top tower
            ctx.beginPath();
            ctx.roundRect(ob.x, -6, ob.w, ob.topH + 6, 10);
            ctx.fill();

            // Bottom tower
            ctx.beginPath();
            ctx.roundRect(ob.x, ob.bottomY, ob.w, H - 24 - ob.bottomY, 10);
            ctx.fill();
        }

        // Draw Treats & Hazards
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (const it of state.items) {
            ctx.save();
            ctx.translate(it.x, it.y);
            if (it.rot) ctx.rotate(it.rot);

            // Glow halo behind item
            ctx.beginPath();
            ctx.arc(0, 0, it.r, 0, Math.PI * 2);
            ctx.fillStyle = it.isHazard ? 'rgba(244, 63, 94, 0.28)' : 'rgba(56, 189, 248, 0.22)';
            ctx.fill();

            ctx.font = `${Math.round(it.r * 1.35)}px sans-serif`;
            ctx.fillText(it.emoji, 0, 2);
            ctx.restore();
        }

        // Draw Player Avatar
        const p = state.player;
        if (state.screen !== 'menu') {
            ctx.save();
            if (p.invulnTimer > 0 && Math.floor(p.invulnTimer * 12) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }
            const expr = p.happyTimer > 0 ? 'happy' : 'normal';
            drawPlayerAvatar(ctx, p.x, p.y, p.r, p.tilt, expr);
            ctx.restore();

            // Helper guide bar in Catcher mode
            if (state.mode === 'catcher') {
                ctx.fillStyle = 'rgba(56, 189, 248, 0.25)';
                ctx.beginPath();
                ctx.roundRect(p.x - 28, p.y + p.r + 8, 56, 5, 3);
                ctx.fill();
            }
        }

        // Draw Particles
        for (const pt of state.particles) {
            ctx.save();
            ctx.globalAlpha = pt.alpha;
            ctx.fillStyle = pt.color;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // Draw Floating Score Texts
        for (const ft of state.floatingTexts) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, ft.alpha);
            ctx.font = '900 18px sans-serif';
            ctx.fillStyle = ft.color;
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 3;
            ctx.strokeText(ft.text, ft.x, ft.y);
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.restore();
        }
    }

    // Main Animation Loop
    let lastTime = performance.now();
    function loop(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        if (state.screen === 'playing') {
            updateGame(dt);
        }
        renderGame();
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // =========================================================================
    // 7. INPUT CONTROLS (TOUCH, MOUSE, KEYBOARD)
    // =========================================================================
    function handleBoostOrTap(clientX) {
        if (state.screen !== 'playing') return;
        const rect = canvas.getBoundingClientRect();
        const relX = clientX - rect.left;

        if (state.mode === 'flappy') {
            state.player.vy = -310;
            sfx.jump();
            spawnParticles(state.player.x, state.player.y + state.player.r, '#38bdf8', 6);
        } else {
            state.player.targetX = relX;
        }
    }

    function handleMove(clientX) {
        if (state.screen !== 'playing' || state.mode !== 'catcher') return;
        const rect = canvas.getBoundingClientRect();
        state.player.targetX = clientX - rect.left;
    }

    canvas.addEventListener('pointerdown', (e) => {
        handleBoostOrTap(e.clientX);
    });

    canvas.addEventListener('pointermove', (e) => {
        if (e.buttons > 0 || e.pointerType === 'touch') {
            handleMove(e.clientX);
        }
    });

    window.addEventListener('keydown', (e) => {
        if (state.screen !== 'playing') return;
        if (state.mode === 'flappy' && (e.code === 'Space' || e.code === 'ArrowUp')) {
            e.preventDefault();
            state.player.vy = -310;
            sfx.jump();
            spawnParticles(state.player.x, state.player.y + state.player.r, '#38bdf8', 6);
        } else if (state.mode === 'catcher') {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
                state.player.targetX -= 42;
            } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
                state.player.targetX += 42;
            }
        }
    });

    // =========================================================================
    // 8. UI BUTTONS, PHOTO UPLOAD & OFFLINE SINGLE-FILE EXPORT
    // =========================================================================
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2600);
    }

    document.getElementById('start-flappy').addEventListener('click', () => startGame('flappy'));
    document.getElementById('start-catcher').addEventListener('click', () => startGame('catcher'));

    document.getElementById('btn-retry').addEventListener('click', () => startGame(state.mode));
    document.getElementById('btn-home').addEventListener('click', () => {
        state.screen = 'menu';
        document.getElementById('hud').style.display = 'none';
        document.getElementById('gameover-overlay').classList.add('hidden');
        document.getElementById('menu-overlay').classList.remove('hidden');
        renderAvatarPreview();
    });

    document.getElementById('btn-sound').addEventListener('click', (e) => {
        sfx.enabled = !sfx.enabled;
        e.currentTarget.textContent = sfx.enabled ? '🔊' : '🔇';
        showToast(sfx.enabled ? 'Sound Effects ON' : 'Sound Effects Muted');
    });

    document.getElementById('btn-pause').addEventListener('click', () => {
        if (state.screen === 'playing') {
            state.screen = 'paused';
            document.getElementById('over-title').textContent = 'GAME PAUSED';
            document.getElementById('over-subtitle').textContent = 'Take a breather!';
            document.getElementById('over-score').textContent = state.score;
            document.getElementById('over-best').textContent =
                state.mode === 'flappy' ? state.bestFlappy : state.bestCatcher;
            document.getElementById('btn-retry').textContent = '▶️ Resume';
            document.getElementById('gameover-overlay').classList.remove('hidden');
        }
    });

    // Override Retry button behavior if paused
    document.getElementById('btn-retry').addEventListener('click', (e) => {
        if (state.screen === 'paused') {
            e.stopImmediatePropagation();
            state.screen = 'playing';
            document.getElementById('btn-retry').textContent = '🔄 Play Again';
            document.getElementById('gameover-overlay').classList.add('hidden');
            lastTime = performance.now();
        }
    }, true);

    // Photo Picker & Base64 Compressor (so users can embed their photo offline)
    const photoInput = document.getElementById('photo-input');
    document.getElementById('avatar-trigger').addEventListener('click', () => photoInput.click());
    document.getElementById('btn-upload-photo').addEventListener('click', () => photoInput.click());

    photoInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            const tempImg = new Image();
            tempImg.onload = () => {
                // Compress & center-crop to 240x240 JPEG Data URL for fast offline storage
                const offCanvas = document.createElement('canvas');
                offCanvas.width = 240;
                offCanvas.height = 240;
                const oCtx = offCanvas.getContext('2d');
                const side = Math.min(tempImg.width, tempImg.height);
                const sx = (tempImg.width - side) / 2;
                const sy = (tempImg.height - side) / 2;
                oCtx.drawImage(tempImg, sx, sy, side, side, 0, 0, 240, 240);
                const dataUrl = offCanvas.toDataURL('image/jpeg', 0.86);
                try {
                    localStorage.setItem('pocket_boss_custom_avatar', dataUrl);
                } catch (err) {
                    // Ignore quota errors
                }
                window.EMBEDDED_AVATAR_DATA = dataUrl;
                avatarImg.src = dataUrl;
                showToast('Character photo updated!');
            };
            tempImg.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    });

    // Save Standalone Offline HTML File (with current avatar permanently embedded)
    document.getElementById('btn-save-offline').addEventListener('click', () => {
        let dataUrl = window.EMBEDDED_AVATAR_DATA || localStorage.getItem('pocket_boss_custom_avatar');

        // If default image_8bf577.jpg is currently loaded, capture it into a Data URL automatically
        if (!dataUrl && avatarLoaded && avatarImg.complete && avatarImg.naturalWidth > 0) {
            try {
                const offCanvas = document.createElement('canvas');
                offCanvas.width = 240;
                offCanvas.height = 240;
                const oCtx = offCanvas.getContext('2d');
                const side = Math.min(avatarImg.naturalWidth, avatarImg.naturalHeight);
                const sx = (avatarImg.naturalWidth - side) / 2;
                const sy = (avatarImg.naturalHeight - side) / 2;
                oCtx.drawImage(avatarImg, sx, sy, side, side, 0, 0, 240, 240);
                dataUrl = offCanvas.toDataURL('image/jpeg', 0.86);
            } catch (e) {
                // Cross-origin canvas taint fallback
            }
        }

        let htmlSource = document.documentElement.outerHTML;
        if (dataUrl) {
            htmlSource = htmlSource.replace(
                'window.EMBEDDED_AVATAR_DATA = null;',
                `window.EMBEDDED_AVATAR_DATA = ${JSON.stringify(dataUrl)};`
            );
        }

        const blob = new Blob(['<!DOCTYPE html>\n' + htmlSource], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Pocket_Boss_Offline_Game.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Offline HTML game downloaded!');
    });
</script>

</body></html>
